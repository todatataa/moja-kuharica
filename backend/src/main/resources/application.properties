spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/recipesdb}
spring.datasource.username=${DB_USER:recipes}
spring.datasource.password=${DB_PASSWORD:recipes123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Sporočila napak (ResponseStatusException) so potrebna obličju za prikaz uporabniku.
server.error.include-message=always

# Seja (prijava)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Izvor obličja, ki sme klicati API s piškotki
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
