services:
  db:
    image: postgres:16
    container_name: recipes-db
    environment:
      POSTGRES_DB: ${DB_NAME:-recipesdb}
      POSTGRES_USER: ${DB_USER:-recipes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-recipes123}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
